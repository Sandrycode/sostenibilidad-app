services:
  - type: web
    name: sostenibilidad-app
    env: python
    buildCommand: "pip install -r requirements.txt && python manage.py collectstatic --noinput"
    startCommand: "gunicorn sostenibilidad_app.wsgi:application"
    envVars:
      - key: DATABASE_URL
        fromDatabase:
          name: sostenibilidad-db
          property: connectionString
    postDeployCommand: "python manage.py migrate"

